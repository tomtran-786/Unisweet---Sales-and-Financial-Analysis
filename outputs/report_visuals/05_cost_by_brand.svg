  <g id="text_21">
   <text style="fill: #004c6d; font: 700 23px 'Arial'; text-anchor: start" x="52.8" y="35.643281" transform="rotate(-0 52.8 35.643281)">Profit held because we spent less, not because we sold more</text>
  </g>
  <g id="text_22">
   <text style="fill: #595959; font: 11.5px 'Arial'; text-anchor: start" x="52.8" y="54.271641" transform="rotate(-0 52.8 54.271641)">Marketing expense and total supply chain cost, EURm  |  FY2024 versus FY2023  |  Paler bar: FY2023  |  The two panels are on different scales</text>
  </g>
  <g id="text_23">
   <text style="fill: #004c6d; font: 700 15px 'Arial'" transform="translate(72 434.819531)">€15.5m less marketing and €9.3m less supply chain cost more than covered</text>
   <text style="fill: #004c6d; font: 700 15px 'Arial'" transform="translate(72 453.544805)">the €10.3m of Gross Profit lost - PBO rose 6.4% on cost alone.</text>
  </g>
  <g id="text_24">
   <text style="fill: #595959; font: 12px 'Arial'; text-anchor: start" x="72" y="497.435625" transform="rotate(-0 72 497.435625)">That lever cannot be pulled twice: supply chain cost per euro of Turnover worsened 35bps, so the saving is a smaller base, not efficiency.</text>
  </g>
  <g id="text_25">
   <text style="fill: #bfbfbf; font: 8.5px 'Arial'; text-anchor: start" x="52.8" y="524.711016" transform="rotate(-0 52.8 524.711016)">Source: P&amp;L Table.xlsx  |  Marketing and supply chain cost are P&amp;L assumptions stated in the source workbook, not measured spend</text>
  </g>
